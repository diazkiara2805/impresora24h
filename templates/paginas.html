<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar páginas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <main class="contenedor">

        <h1>Seleccionar páginas</h1>

        <p>Documento: {{ nombre }}</p>
        <p>El PDF tiene {{ cantidad }} páginas.</p>

        <form action="/seleccionar" method="POST">

            <h2>Elegí las páginas</h2>

            <label>
                <input type="checkbox" id="todas">
                Seleccionar todas
            </label>

            <div class="paginas">

                {% for numero in range(1, cantidad + 1) %}

                    <label>
                        <input
                            type="checkbox"
                            name="paginas"
                            value="{{ numero }}"
                            class="pagina"
                        >
                        Página {{ numero }}
                    </label>

                {% endfor %}

            </div>

            <h2>Tipo de impresión</h2>

            <label>
                <input
                    type="radio"
                    name="tipo_impresion"
                    value="blanco y negro"
                    checked
                >
                Blanco y negro - $100 por página
            </label>

            <label>
                <input
                    type="radio"
                    name="tipo_impresion"
                    value="color"
                >
                Color - $200 por página
            </label>

            <h2>Forma de pago</h2>

            <label>
                <input
                    type="radio"
                    name="forma_pago"
                    value="efectivo"
                    checked
                >
                Efectivo
            </label>

            <label>
                <input
                    type="radio"
                    name="forma_pago"
                    value="qr"
                >
                QR
            </label>

            <button type="submit">Confirmar pedido</button>

        </form>

        <button type="button" onclick="history.back()">← Volver</button>

    </main>

    <script>
        const todas = document.getElementById("todas");
        const paginas = document.querySelectorAll(".pagina");

        todas.addEventListener("change", function () {
            paginas.forEach(function (pagina) {
                pagina.checked = todas.checked;
            });
        });

        paginas.forEach(function (pagina) {
            pagina.addEventListener("change", function () {
                todas.checked = [...paginas].every(
                    p => p.checked
                );
            });
        });
    </script>

</body>
</html>
